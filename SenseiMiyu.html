<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Speak Japanese with Sensei Miyu</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary: #58cc02;
  --primary-dark: #46a302;
  --bg: #111111;
  --card: #1e1e1e;
  --text: #ffffff;
  --text-muted: #aaaaaa;
  --bubble: #2a2a2a;
  --accent: #ff4b4b;
  --blue: #1cb0f6;
}

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

.screen {
  display: none;
  min-height: 100vh;
  padding: 20px;
}

.screen.active {
  display: flex;
  flex-direction: column;
}

/* ========== HOME ========== */
#screen-home {
  justify-content: center;
  align-items: center;
  text-align: center;
  background: linear-gradient(180deg, #0d0d0d 0%, #1a1a2e 100%);
}

.home-portrait {
  width: 180px;
  height: auto;
  border-radius: 16px;
  margin-bottom: 20px;
  image-rendering: pixelated;
  box-shadow: 0 0 40px rgba(88, 204, 2, 0.3);
}

.logo-area h1 {
  font-size: 2.4rem;
  font-weight: 800;
  letter-spacing: -1px;
}

.logo-area h2 {
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.highlight {
  color: var(--primary);
}

.tagline {
  color: var(--text-muted);
  margin-bottom: 40px;
  font-size: 1.1rem;
}

/* ========== BUTTONS ========== */
.btn-primary {
  background: var(--primary);
  color: #111;
  border: none;
  padding: 16px 48px;
  font-size: 1.2rem;
  font-weight: 800;
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 0 4px 0 var(--primary-dark);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 0 var(--primary-dark);
}

.btn-primary:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 var(--primary-dark);
}

.btn-choice {
  background: var(--card);
  color: var(--text);
  border: 2px solid #333;
  padding: 14px 20px;
  font-size: 1.05rem;
  font-weight: 600;
  border-radius: 12px;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: all 0.15s;
  margin-bottom: 10px;
}

.btn-choice:hover {
  border-color: var(--primary);
  background: #252525;
}

.btn-back {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 1rem;
  cursor: pointer;
  font-weight: 600;
}

.btn-speak {
  background: var(--blue);
  color: white;
  border: none;
  padding: 14px 32px;
  font-size: 1.1rem;
  font-weight: 700;
  border-radius: 14px;
  cursor: pointer;
  margin-top: 16px;
  box-shadow: 0 4px 0 #1899d6;
}

/* ========== DIÁLOGO INTRO ========== */
#screen-intro {
  justify-content: center;
  align-items: center;
  background: linear-gradient(180deg, #0d0d0d 0%, #1a1a2e 100%);
}

.dialogue-container {
  max-width: 600px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

.character-side {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.miyu-sprite {
  width: 160px;
  height: auto;
  image-rendering: pixelated;
  border-radius: 12px;
}

.miyu-sprite-main {
  width: 140px;
  height: auto;
  image-rendering: pixelated;
  border-radius: 12px;
}

.miyu-sprite-large {
  width: 200px;
  height: auto;
  image-rendering: pixelated;
  border-radius: 16px;
  margin-bottom: 20px;
}

.speech-bubble {
  background: var(--bubble);
  padding: 16px 20px;
  border-radius: 18px;
  position: relative;
  max-width: 340px;
  text-align: center;
  border: 2px solid #333;
}

.speech-bubble::after {
  content: '';
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  border-width: 0 10px 10px 10px;
  border-style: solid;
  border-color: transparent transparent #333 transparent;
}

.speech-bubble p {
  font-size: 1.05rem;
  line-height: 1.45;
  font-weight: 600;
}

.speech-bubble.small {
  max-width: 220px;
  padding: 12px 16px;
}

.speech-bubble.small p {
  font-size: 0.95rem;
}

.choices-area {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ========== MAIN SCREEN ========== */
#screen-main {
  padding: 0;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  background: var(--card);
  border-bottom: 1px solid #333;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 16px;
  font-weight: 700;
}

.streak {
  background: #2a2a2a;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.95rem;
}

.xp-bar-container {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 180px;
}

.xp-bar {
  flex: 1;
  height: 12px;
  background: #333;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}

.xp-bar::after {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: var(--xp-percent, 0%);
  background: var(--primary);
  border-radius: 6px;
  transition: width 0.4s;
}

#xp-text {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-muted);
  min-width: 50px;
}

.main-layout {
  display: flex;
  gap: 24px;
  padding: 24px;
  max-width: 1000px;
  margin: 0 auto;
  width: 100%;
}

.miyu-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  min-width: 180px;
}

.lessons-area {
  flex: 1;
}

.lessons-area h2 {
  margin-bottom: 20px;
  font-size: 1.4rem;
}

.unit {
  background: var(--card);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  border: 2px solid #333;
}

.unit h3 {
  font-size: 1.15rem;
  margin-bottom: 6px;
}

.unit p {
  color: var(--text-muted);
  font-size: 0.9rem;
  margin-bottom: 14px;
}

.unit-lessons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.lesson-btn {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 3px solid #444;
  background: #2a2a2a;
  color: var(--text);
  font-weight: 800;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  position: relative;
}

.lesson-btn.locked {
  opacity: 0.4;
  cursor: not-allowed;
}

.lesson-btn.completed {
  border-color: var(--primary);
  background: rgba(88, 204, 2, 0.15);
  color: var(--primary);
}

.lesson-btn.current {
  border-color: var(--blue);
  background: rgba(28, 176, 246, 0.15);
  box-shadow: 0 0 12px rgba(28, 176, 246, 0.4);
}

.lesson-btn:not(.locked):hover {
  transform: scale(1.08);
}

/* ========== LESSON SCREEN ========== */
#screen-lesson {
  padding: 16px;
}

.lesson-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}

.lesson-progress {
  flex: 1;
  height: 14px;
  background: #333;
  border-radius: 8px;
  overflow: hidden;
}

.lesson-bar {
  height: 100%;
  background: var(--primary);
  width: 0%;
  transition: width 0.3s;
  border-radius: 8px;
}

#lesson-counter {
  font-weight: 700;
  color: var(--text-muted);
  min-width: 40px;
}

.lesson-body {
  max-width: 600px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

.miyu-lesson {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.exercise-area {
  width: 100%;
  background: var(--card);
  border-radius: 16px;
  padding: 24px;
  border: 2px solid #333;
  text-align: center;
}

.prompt-text {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 8px;
}

.prompt-romaji {
  color: var(--text-muted);
  margin-bottom: 20px;
  font-size: 1rem;
}

.input-area {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
}

.speak-input {
  width: 100%;
  max-width: 320px;
  padding: 14px 18px;
  font-size: 1.1rem;
  border-radius: 12px;
  border: 2px solid #444;
  background: #1a1a1a;
  color: var(--text);
  text-align: center;
  font-family: inherit;
}

.speak-input:focus {
  outline: none;
  border-color: var(--blue);
}

.feedback {
  margin-top: 16px;
  font-weight: 700;
  font-size: 1.1rem;
  min-height: 28px;
}

.feedback.correct {
  color: var(--primary);
}

.feedback.wrong {
  color: var(--accent);
}

/* ========== RESULT ========== */
#screen-result {
  justify-content: center;
  align-items: center;
  text-align: center;
  background: linear-gradient(180deg, #0d0d0d 0%, #1a1a2e 100%);
}

.result-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  max-width: 420px;
}

.score-display {
  font-size: 3.5rem;
  font-weight: 800;
  color: var(--primary);
  margin: 10px 0;
}

.result-bubble {
  max-width: 360px;
}

/* Responsive */
@media (max-width: 700px) {
  .main-layout {
    flex-direction: column;
    align-items: center;
  }
  
  .miyu-panel {
    flex-direction: row;
    gap: 16px;
  }
  
  .logo-area h1 {
    font-size: 1.9rem;
  }
}

  .miyu-sprite, .miyu-sprite-main, .miyu-sprite-large, .home-portrait {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #1a1a1a;
    border-radius: 12px;
  }
  .home-portrait {
    width: 150px;
    height: 150px;
    object-fit: cover;
    object-position: center top;
    border-radius: 16px;
    box-shadow: 0 0 30px rgba(88, 204, 2, 0.25);
    overflow: hidden;
  }
  .miyu-sprite, .miyu-sprite-main, .miyu-sprite-large {
    object-fit: cover;
    object-position: center top;
  }
  .units { max-height: 70vh; overflow-y: auto; padding-right: 8px; }
  .unit { margin-bottom: 12px; }
  </style>
</head>
<body>
  <div id="screen-home" class="screen active">
    <div class="home-content">
      <div class="logo-area">
        <img id="home-portrait" alt="Sensei Miyu" class="home-portrait">
        <h1>Speak Japanese</h1>
        <h2>with Sensei <span class="highlight">Miyu</span></h2>
        <p class="tagline">Aprenda a <strong>falar</strong> japonês de verdade</p>
        <p style="color:#888;font-size:0.9rem;margin-top:8px" id="units-count"></p>
      </div>
      <button class="btn-primary" onclick="startIntro()">Começar</button>
    </div>
  </div>

  <div id="screen-intro" class="screen">
    <div class="dialogue-container">
      <div class="character-side">
        <img id="intro-miyu" alt="Miyu" class="miyu-sprite">
        <div class="speech-bubble"><p id="intro-text">...</p></div>
      </div>
      <div class="choices-area" id="intro-choices"></div>
    </div>
  </div>

  <div id="screen-main" class="screen">
    <header class="top-bar">
      <div class="user-info">
        <span id="user-name-display">Aluno</span>
        <div class="streak"><span>🔥</span> <span id="streak-count">0</span></div>
        <button onclick="if(confirm('Apagar todo o progresso?')) resetProgress()" style="background:none;border:none;color:#666;font-size:0.75rem;cursor:pointer;margin-left:8px;">reset</button>
      </div>
      <div class="xp-bar-container">
        <div class="xp-bar" id="xp-bar"></div>
        <span id="xp-text">0 XP</span>
      </div>
    </header>
    <div class="main-layout">
      <aside class="miyu-panel">
        <img id="main-miyu" alt="Miyu" class="miyu-sprite-main">
        <div class="speech-bubble small"><p id="main-text">Pronto para estudar?</p></div>
      </aside>
      <section class="lessons-area">
        <h2>Seu Progresso (<span id="progress-count">0</span> unidades)</h2>
        <div class="units" id="units-list"></div>
      </section>
    </div>
  </div>

  <div id="screen-lesson" class="screen">
    <div class="lesson-header">
      <button class="btn-back" onclick="exitLesson()">← Voltar</button>
      <div class="lesson-progress"><div class="lesson-bar" id="lesson-bar"></div></div>
      <span id="lesson-counter">1/5</span>
    </div>
    <div class="lesson-body">
      <div class="miyu-lesson">
        <img id="lesson-miyu" alt="Miyu" class="miyu-sprite">
        <div class="speech-bubble"><p id="lesson-text">Repita depois de mim...</p></div>
      </div>
      <div class="exercise-area" id="exercise-area"></div>
    </div>
  </div>

  <div id="screen-result" class="screen">
    <div class="result-content">
      <img id="result-miyu" alt="Miyu" class="miyu-sprite-large">
      <div class="speech-bubble result-bubble"><p id="result-text">...</p></div>
      <div class="score-display"><span id="final-score">0%</span></div>
      <button class="btn-primary" onclick="goToMain()">Continuar</button>
    </div>
  </div>

// ========== SAVE / LOAD SYSTEM ==========
function saveProgress() {
  const data = {
    userName: state.userName,
    xp: state.xp,
    streak: state.streak,
    completedLessons: state.completedLessons,
    hasFinishedIntro: state.hasFinishedIntro
  };
  try {
    localStorage.setItem("miyu_save", JSON.stringify(data));
  } catch(e) {
    console.log("Não foi possível salvar:", e);
  }
}

function loadProgress() {
  try {
    const raw = localStorage.getItem("miyu_save");
    if (!raw) return false;
    const data = JSON.parse(raw);
    state.userName = data.userName || "Aluno";
    state.xp = data.xp || 0;
    state.streak = data.streak || 0;
    state.completedLessons = data.completedLessons || {};
    state.hasFinishedIntro = data.hasFinishedIntro || false;
    return true;
  } catch(e) {
    console.log("Erro ao carregar save:", e);
    return false;
  }
}

function resetProgress() {
  localStorage.removeItem("miyu_save");
  location.reload();
}

document.getElementById('units-count').innerText = units.length + " unidades disponíveis";

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function setMiyu(imgId, expression) {
  const img = document.getElementById(imgId);
  if (img) img.src = expressions[expression] || expressions.normal;
}
function randomMamonas() { return mamonasLines[Math.floor(Math.random()*mamonasLines.length)]; }
function getScoreReaction(percent) {
  if (percent <= 30) return {expression:"chorando", text:"Precisa melhorar… mas eu vou te ajudar.\nAqui está uma prova extra de 1 hora. Não reclame."};
  if (percent <= 50) return {expression:"normal", text:"Olha… você está indo bem.\nContinue assim."};
  if (percent <= 70) return {expression:"feliz", text:"Uau… está ficando bom bem rápido.\nMeus parabéns."};
  return {expression:"especial", text:"Arrasou! Que nem o show dos Mamonas Assassinas.\n" + randomMamonas() + "\nContinue assim."};
}

function startIntro() { currentIntroStep=0; showScreen("screen-intro"); renderIntroStep(); }
function renderIntroStep() {
  const step = introSteps[currentIntroStep];
  document.getElementById("intro-text").innerText = step.text.replace("{name}", state.userName);
  setMiyu("intro-miyu", step.expression);
  const choicesDiv = document.getElementById("intro-choices");
  choicesDiv.innerHTML = "";
  if (step.special === "name") {
    const input = document.createElement("input");
    input.type="text"; input.placeholder="Digite seu nome..."; input.className="speak-input"; input.id="name-input"; input.maxLength=20;
    const btn = document.createElement("button"); btn.className="btn-primary"; btn.style.marginTop="12px"; btn.innerText="Continuar";
    btn.onclick = () => {
      const name = document.getElementById("name-input").value.trim();
      if (name) {
        state.userName = name;
        document.getElementById("user-name-display").innerText = name;
        saveProgress();
      }
      currentIntroStep=2; renderIntroStep();
    };
    choicesDiv.appendChild(input); choicesDiv.appendChild(btn); setTimeout(()=>input.focus(),100); return;
  }
  if (step.choices) step.choices.forEach(c => {
    const btn=document.createElement("button"); btn.className="btn-choice"; btn.innerText=c.label;
    btn.onclick=()=>{ if(c.next==="finish") finishIntro(); else { currentIntroStep=c.next; renderIntroStep(); } };
    choicesDiv.appendChild(btn);
  });
}
function finishIntro() {
  state.streak = 1;
  state.hasFinishedIntro = true;
  saveProgress();
  renderMain();
  showScreen("screen-main");
  setMiyu("main-miyu", "feliz");
  document.getElementById("main-text").innerText = "Bem-vindo, " + state.userName + ".\nVamos começar.";
}

function renderMain() {
  document.getElementById("streak-count").innerText=state.streak;
  document.getElementById("xp-text").innerText=state.xp+" XP";
  document.getElementById("xp-bar").style.setProperty("--xp-percent", Math.min(state.xp%100,100)+"%");
  document.getElementById("progress-count").innerText=units.length;
  const unitsList=document.getElementById("units-list"); unitsList.innerHTML="";
  units.forEach((unit,uIndex)=>{
    const unitDiv=document.createElement("div"); unitDiv.className="unit";
    let lessonsHtml="";
    unit.lessons.forEach((lesson,lIndex)=>{
      const key=uIndex+"-"+lIndex;
      const isCompleted=!!state.completedLessons[key];
      const isCurrent=!isCompleted && isLessonUnlocked(uIndex,lIndex);
      const isLocked=!isCompleted && !isCurrent;
      let cls="lesson-btn"+(isCompleted?" completed":isCurrent?" current":" locked");
      const click=isLocked?"":"startLesson("+uIndex+","+lIndex+")";
      lessonsHtml+='<button class="'+cls+'" onclick="'+click+'">'+(isCompleted?"✓":(lIndex+1))+'</button>';
    });
    unitDiv.innerHTML='<h3>'+unit.title+'</h3><p>'+unit.description+'</p><div class="unit-lessons">'+lessonsHtml+'</div>';
    unitsList.appendChild(unitDiv);
  });
}
function isLessonUnlocked(u,l) {
  if(u===0&&l===0) return true;
  if(l>0) return !!state.completedLessons[u+"-"+(l-1)];
  const prev=units[u-1]; if(!prev) return false;
  return !!state.completedLessons[(u-1)+"-"+(prev.lessons.length-1)];
}

let currentExercises=[], currentExerciseIndex=0;
function startLesson(u,l) {
  state.currentUnit=u; state.currentLesson=l;
  currentExercises=units[u].lessons[l].exercises;
  currentExerciseIndex=0; state.correctCount=0; state.totalExercises=currentExercises.length;
  showScreen("screen-lesson"); renderExercise();
}
function renderExercise() {
  const ex=currentExercises[currentExerciseIndex];
  document.getElementById("lesson-bar").style.width=((currentExerciseIndex/currentExercises.length)*100)+"%";
  document.getElementById("lesson-counter").innerText=(currentExerciseIndex+1)+"/"+currentExercises.length;
  setMiyu("lesson-miyu","normal");
  document.getElementById("lesson-text").innerText="Repita em voz alta (ou digite o romaji):";
  document.getElementById("exercise-area").innerHTML=
    '<div class="prompt-text">'+ex.japanese+'</div>'+
    '<div class="prompt-romaji">'+ex.romaji+'</div>'+
    '<div style="color:var(--text-muted);margin-bottom:16px;font-size:0.95rem">'+ex.meaning+'</div>'+
    '<div class="input-area"><input type="text" class="speak-input" id="answer-input" placeholder="Digite o romaji..." autocomplete="off">'+
    '<button class="btn-speak" onclick="checkAnswer()">Verificar</button></div><div class="feedback" id="feedback"></div>';
  const input=document.getElementById("answer-input"); input.focus();
  input.onkeydown=e=>{if(e.key==="Enter")checkAnswer();};
}
function normalize(s){return s.toLowerCase().trim().replace(/[āáàäâ]/g,"a").replace(/[ēéèëê]/g,"e").replace(/[īíìïî]/g,"i").replace(/[ōóòöô]/g,"o").replace(/[ūúùüû]/g,"u").replace(/[^a-z0-9\s]/g,"").replace(/\s+/g," ");}
function checkAnswer(){
  const input=document.getElementById("answer-input");
  const feedback=document.getElementById("feedback");
  const user=normalize(input.value);
  const ex=currentExercises[currentExerciseIndex];
  const ok=ex.accept.some(a=>normalize(a)===user||user.includes(normalize(a)));
  if(ok){state.correctCount++;feedback.innerText="✓ Correto!";feedback.className="feedback correct";setMiyu("lesson-miyu","feliz");document.getElementById("lesson-text").innerText="Bom.";}
  else{feedback.innerText="✗ Quase... A resposta era: "+ex.romaji;feedback.className="feedback wrong";setMiyu("lesson-miyu","irritada");document.getElementById("lesson-text").innerText="Tente de novo depois.";}
  input.disabled=true; document.querySelector(".btn-speak").disabled=true;
  setTimeout(()=>{currentExerciseIndex++; if(currentExerciseIndex>=currentExercises.length) finishLesson(); else renderExercise();},1400);
}
function finishLesson(){
  const percent=Math.round((state.correctCount/state.totalExercises)*100);
  const reaction=getScoreReaction(percent);
  state.completedLessons[state.currentUnit + "-" + state.currentLesson] = true;
  state.xp += Math.round(percent * 0.8) + 20;
  if (percent >= 60) state.streak++;
  saveProgress();
  setMiyu("result-miyu",reaction.expression);
  document.getElementById("result-text").innerText=reaction.text;
  document.getElementById("final-score").innerText=percent+"%";
  showScreen("screen-result");
}
function exitLesson(){renderMain();showScreen("screen-main");setMiyu("main-miyu","normal");document.getElementById("main-text").innerText="Voltou… tudo bem.\nQuando quiser continuar, eu estou aqui.";}
function goToMain(){
  renderMain(); showScreen("screen-main");
  const p=Math.round((state.correctCount/state.totalExercises)*100);
  if(p>=80){setMiyu("main-miyu","especial");document.getElementById("main-text").innerText="Bom trabalho hoje.\nNão se acomode.";}
  else if(p<=30){setMiyu("main-miyu","triste");document.getElementById("main-text").innerText="Vamos treinar mais depois.\nEu não desisto de você.";}
  else{setMiyu("main-miyu","normal");document.getElementById("main-text").innerText="Continue praticando.\nFalar todo dia faz diferença.";}
}
// Load save on start
const hasSave = loadProgress();
if (hasSave && state.hasFinishedIntro) {
  document.getElementById("user-name-display").innerText = state.userName;
  renderMain();
  showScreen("screen-main");
  setMiyu("main-miyu", "normal");
  document.getElementById("main-text").innerText = "De volta, " + state.userName + ".\nPronto para continuar?";
} else {
  showScreen("screen-home");
}
